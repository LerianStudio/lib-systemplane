name: PR Security Scan

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/pr-security-scan.yml@a3e72f697b0e104e6f67971d0a8ecbba590c0923 # v1.66.3
    with:
      enable_docker_scan: false
      # CodeQL static analysis stays off here; gosec (in go-combined-analysis)
      # already covers Go security scanning and uploads SARIF to the Security tab.
      enable_codeql: false
    secrets: inherit
