name: Go Combined Analysis

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  go-analysis:
    name: Go Analysis
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-pr-analysis.yml@v1.44.0
    permissions:
      id-token: write
      actions: read # required by go-pr-analysis.yml >= v1.44.0; missing grant = startup_failure
      contents: read
      pull-requests: write
      security-events: write
    with:
      go_version: "1.26.3"
      golangci_lint_version: "v2.12.2"
      fail_on_coverage_threshold: true
      go_private_modules: "github.com/LerianStudio/*"
      enable_integration_tests: true
      integration_test_command: "make test-integration LOW_RESOURCE=1"
    secrets: inherit

  # TODO: move to shared workflow once it supports build-tagged perf gates.
  # AC15 perf gate is build-tagged `unit && !race` because the race detector
  # adds 10-50x latency overhead, making sub-microsecond thresholds
  # meaningless. Run the gate explicitly without -race so a regression in
  # GetForTenant fails CI rather than going silently unnoticed in the
  # race-enabled lane.
  perf-gate:
    name: AC15 Perf Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run AC15 perf gate (no -race)
        run: go test -tags=unit -run=^TestPerf_ ./...
