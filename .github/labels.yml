# Label definitions for lib-systemplane
# Synced via .github/workflows/routine.yml -> shared labels-sync.

# ── Scopes (aligned with .github/labeler.yml) ─────────────────────────────────

- name: admin
  color: "0db7ed"
  description: Admin HTTP surface (Fiber handlers)

- name: client
  color: "1d76db"
  description: Client implementation (lifecycle, cache, telemetry)

- name: debounce
  color: "fbca04"
  description: Trailing-edge changefeed debouncer

- name: mongodb
  color: "13aa52"
  description: MongoDB backend (change streams, polling fallback)

- name: postgres
  color: "336791"
  description: Postgres backend (pgx, LISTEN/NOTIFY)

- name: store
  color: "5319e7"
  description: Backend-agnostic Store interface

- name: systemplanetest
  color: "00ADD8"
  description: Backend-agnostic contract test suite

- name: core
  color: "0db7ed"
  description: Top-level public API surface (api_*.go, doc.go)

- name: scripts
  color: "fef2c0"
  description: Build and tooling scripts

- name: config
  color: "d4a017"
  description: Application and tooling configuration

- name: ci
  color: "2088FF"
  description: Continuous integration pipelines

- name: docs
  color: "0075ca"
  description: Documentation and markdown content

- name: tests
  color: "00ADD8"
  description: Unit, integration and end-to-end tests

- name: deps
  color: "ededed"
  description: Go module dependencies (usually opened by Dependabot)

# ── Change types ──────────────────────────────────────────────────────────────

- name: bug
  color: "d73a4a"
  description: Something is not working as expected

- name: enhancement
  color: "a2eeef"
  description: New feature or improvement request

- name: dependencies
  color: "ededed"
  description: Dependency updates (Dependabot)

- name: github-actions
  color: "2088FF"
  description: Updates to GitHub Actions dependencies

- name: breaking-change
  color: "b60205"
  description: Callers must update their integration after this change

- name: skip-changelog
  color: "ffffff"
  description: This change does not need a changelog entry

# ── PR size ───────────────────────────────────────────────────────────────────

- name: size/XS
  color: "3CBF00"
  description: "PR changes < 50 lines"

- name: size/S
  color: "5D9801"
  description: "PR changes 50–199 lines"

- name: size/M
  color: "7F7203"
  description: "PR changes 200–499 lines"

- name: size/L
  color: "A14C05"
  description: "PR changes 500–999 lines"

- name: size/XL
  color: "C32607"
  description: "PR changes ≥ 1000 lines — consider splitting"

# ── Triage and stale management ───────────────────────────────────────────────

- name: triage
  color: "e4e669"
  description: Needs initial assessment

- name: stale
  color: "795548"
  description: No recent activity — will be closed if not updated

- name: no-stale
  color: "fef2c0"
  description: Exempt from stale auto-close

- name: work-in-progress
  color: "ffa500"
  description: Active work — exempt from stale auto-close

- name: pinned
  color: "d4a017"
  description: Pinned discussion/tracker — exempt from stale auto-close

# ── Automation ────────────────────────────────────────────────────────────────

- name: automated
  color: "ededed"
  description: Opened by automation (release backmerges, etc.)

- name: backmerge
  color: "5319e7"
  description: Backmerge PR (main → develop after release)
